  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Decision-support framework and standardized evidence pack compiler for Safe &amp; Secure Data Intelligence Environments (SDE &amp; TRE), Caldicott Principles 1–8, and Section 251 statutory compliance." />
    <meta property="og:title" content="Seawater | NHS &amp; UK Public Sector Information Governance Platform" />
    <meta property="og:description" content="Decision-support framework and standardized evidence pack compiler for Safe &amp; Secure Data Intelligence Environments (SDE &amp; TRE), Caldicott Principles 1–8, and Section 251 statutory compliance." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/seawater-logo.jpg" />
    <link rel="icon" type="image/jpeg" href="/seawater-logo.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Public+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet" />
    <script>
      // Suppress dev-mode HMR and WebSocket transport errors as per environment specification
      window.addEventListener('error', function (event) {
        if (
          event.message &&
          (event.message.includes('WebSocket') ||
           event.message.includes('createWebSocketModuleRunnerTransport') ||
           event.message.includes('vite:ws'))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        var reason = '' + (event.reason && (event.reason.message || event.reason.stack || event.reason));
        if (
          reason.includes('WebSocket') ||
          reason.includes('createWebSocketModuleRunnerTransport') ||
          reason.includes('vite:ws')
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-sky-100 selection:text-sky-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
